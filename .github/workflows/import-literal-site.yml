name: Importar site público da Literal Group
on:
  push:
    branches:
      - live-site
    paths:
      - .github/workflows/import-literal-site.yml
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-site
      - name: Baixar páginas e recursos públicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p novo-site
          mkdir -p novo-site/assets
          curl -fLsS --retry 2 --max-time 25 'https://literal-group.eduardokraus.chatgpt.site/assets/social.svg' -o novo-site/assets/social.svg
          wget --mirror --recursive --level=4 --page-requisites --adjust-extension --convert-links --no-parent --no-host-directories --directory-prefix=novo-site --domains=literal-group.eduardokraus.chatgpt.site --quota=80m --timeout=20 --tries=2 --wait=0.1 -e robots=off 'https://literal-group.eduardokraus.chatgpt.site/' || true
          test -s novo-site/index.html
          echo 'Arquivos capturados:'
          find novo-site -type f | sort
      - name: Preservar parametros de navegacao na copia estatica
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('novo-site').rglob('*.html'):
              original = path.read_text(encoding='utf-8')
              fixed = original.replace('ecossistema/index.html%3Fvertical=tecnologia.html', 'ecossistema.html?vertical=tecnologia')
              fixed = re.sub(r'((?:\\.\\./)*)contato/index\\.html%3Fnegocio=([a-z0-9-]+)\\.html', lambda m: m.group(1) + 'contato.html?negocio=' + m.group(2), fixed)
              if fixed != original:
                  path.write_text(fixed, encoding='utf-8')
          PY
      - name: Salvar captura na branch live-site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add novo-site
          if ! git diff --cached --quiet; then
            git commit -m 'Importa versão pública do site Literal Group para novo-site'
            git push origin HEAD:live-site
          fi
