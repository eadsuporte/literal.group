name: Ajustar imagem social local
on:
  push:
    branches: [live-site]
    paths:
      - .github/workflows/seo-local-image.yml
permissions:
  contents: write
jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-site
          fetch-depth: 1
      - name: Converter Open Graph SVG para PNG e ajustar referencias
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          base = Path('novo-site')
          cairosvg.svg2png(url=str(base / 'assets/social.svg'), write_to=str(base / 'assets/social.png'), output_width=1200, output_height=630)
          pages = list(base.rglob('*.html'))
          for page in pages:
              content = page.read_text(encoding='utf-8')
              content = content.replace('assets/social.svg', 'assets/social.png')
              if 'literal-group.eduardokraus.chatgpt.site' in content:
                  raise SystemExit(f'Dominio temporario ainda presente em {page}')
              page.write_text(content, encoding='utf-8')
          print(f'Imagem PNG e {len(pages)} paginas processadas')
          PY
          printf 'User-agent: *\nAllow: /\n' > novo-site/robots.txt
      - name: Criar commit na live-site
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add novo-site
          if ! git diff --cached --quiet; then
            git commit -m 'Otimiza SEO e cria imagem social PNG local'
            git push origin HEAD:live-site
          fi
