<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Literal Group Services</title>
    <meta name="description" content="The page you requested could not be found. Explore Literal Group Services hosting, plugins, upgrades and professional Software Moodle™ services.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://literal.group/404.html">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 48px 24px;
            color: #fff;
            background: radial-gradient(circle at 20% 20%, rgba(78, 215, 245, .22), transparent 35%),
                        radial-gradient(circle at 80% 75%, rgba(112, 71, 214, .28), transparent 40%),
                        linear-gradient(145deg, #071426, #101d3e 55%, #18143a);
        }
        .error-card {
            width: min(760px, 100%);
            padding: clamp(36px, 7vw, 72px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 30px;
            background: rgba(255, 255, 255, .07);
            box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
            backdrop-filter: blur(18px);
        }
        .error-logo {
            display: block;
            width: min(260px, 70%);
            margin: 0 auto 38px;
        }
        .error-code {
            margin: 0;
            font-size: clamp(5rem, 18vw, 10rem);
            line-height: .8;
            font-weight: 900;
            letter-spacing: -.06em;
            color: #7ff2d2;
            text-shadow: 0 0 35px rgba(127, 242, 210, .25);
        }
        .error-card h1 {
            margin: 28px 0 16px;
            color: #fff;
            font-size: clamp(2rem, 5vw, 3.2rem);
        }
        .error-card p {
            max-width: 580px;
            margin: 0 auto 34px;
            color: rgba(255, 255, 255, .78);
            font-size: 1.1rem;
            line-height: 1.7;
        }
        .error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }
        .error-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 0 24px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
        }
        .error-primary {
            color: #09251e;
            background: #7ff2d2;
        }
        .error-secondary {
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .28);
            background: rgba(255, 255, 255, .07);
        }
        .error-actions a:hover,
        .error-actions a:focus-visible {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<main class="error-page">
    <section class="error-card" aria-labelledby="error-title">
        <a href="/" aria-label="Literal Group Services home">
            <img class="error-logo" src="/assets/images/logo-mylearn.png" alt="Literal Group Services">
        </a>
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">This page could not be found</h1>
        <p>The address may have changed or the page may no longer exist. Return to the homepage or continue exploring our plugins and professional Software Moodle™ services.</p>
        <nav class="error-actions" aria-label="Useful links">
            <a class="error-primary" href="/">Go to homepage</a>
            <a class="error-secondary" href="/services">Explore services</a>
            <a class="error-secondary" href="/plugins">View plugins</a>
        </nav>
    </section>
</main>
</body>
</html>
