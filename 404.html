<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Página não encontrada | MyLearn.space</title>
    <meta name="description" content="A página que você tentou acessar não foi encontrada no MyLearn.space. Volte para a página inicial e continue sua experiência de aprendizagem online.">
    <meta name="robots" content="noindex, follow">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Página não encontrada | MyLearn.space">
    <meta property="og:description" content="A página que você tentou acessar não foi encontrada. Volte para a página inicial do MyLearn.space.">
    <meta property="og:url" content="https://mylearn.space/404.html">
    <meta property="og:site_name" content="MyLearn.space">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Página não encontrada | MyLearn.space">
    <meta name="twitter:description" content="A página que você tentou acessar não foi encontrada. Volte para a página inicial do MyLearn.space.">

    <link rel="canonical" href="https://mylearn.space/">

    <style>
        :root {
            color-scheme: light;
            --bg: #f4f8ff;
            --card: #ffffff;
            --text: #17233c;
            --muted: #61708f;
            --primary: #0b63ce;
            --primary-dark: #084a9b;
            --border: #dce7f8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(11, 99, 206, .18), transparent 32rem),
                linear-gradient(135deg, #f4f8ff 0%, #eaf2ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            width: min(720px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: clamp(32px, 6vw, 64px);
            box-shadow: 0 24px 70px rgba(23, 35, 60, .12);
            text-align: center;
        }

        .code {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 96px;
            height: 48px;
            margin-bottom: 24px;
            border-radius: 999px;
            background: rgba(11, 99, 206, .1);
            color: var(--primary-dark);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(32px, 6vw, 52px);
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 auto 32px;
            max-width: 560px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.65;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 24px;
            border-radius: 999px;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 14px 28px rgba(11, 99, 206, .22);
        }

        a:hover,
        a:focus {
            background: var(--primary-dark);
        }

        small {
            display: block;
            margin-top: 28px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <span class="code">404</span>
        <h1>Página não encontrada</h1>
        <p>O endereço acessado não existe ou foi movido. Volte para a página inicial do MyLearn.space e continue sua experiência de aprendizagem online.</p>
        <a href="/">Voltar para o início</a>
        <small>MyLearn.space</small>
    </main>
</body>
</html>
