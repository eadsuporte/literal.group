<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Em construção | Literal Group</title>
    <meta name="description" content="O site da Literal Group está em construção. Em breve teremos novidades.">
    <meta name="robots" content="noindex, follow">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: #f8fafc;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }
        main { max-width: 36rem; }
        h1 { font-size: clamp(2.5rem, 7vw, 4rem); margin: 0 0 1rem; line-height: 1.15; }
        p { font-size: 1.125rem; color: #475569; margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
    <main>
        <h1>Em construção</h1>
        <p>Estamos preparando nosso novo site. Volte em breve!</p>
    </main>
</body>
</html>
